name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: ${{ matrix.group }}
    continue-on-error: ${{ matrix.group == 'visual' }}
    strategy:
      fail-fast: false
      matrix:
        group: [structure, data, behavior, visual, resources]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.group == 'behavior' || matrix.group == 'visual' || matrix.group == 'resources'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.group }}
          path: |
            .cache/checks/
            test-results/
          if-no-files-found: ignore
